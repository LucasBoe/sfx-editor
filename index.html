<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <link rel="stylesheet" href="/src/icons.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" href="/public/favicon.ico" />
  </head>

  <body>
    <div class="container">
      <div class="row">
        <div class="col">
          <h1 class="my-3">Sound Sheep <img src="src/soundsheep.png"> v.0.1.2</img></h1>
        </div>
        <div class="col d-flex align-items-center gap-2">
          <div id="globalMeter" class="meter" title="Click to reset peak and clip">
            <div id="globalMeterFill" class="meterFill" style="width: 0%;">
              <div id="globalMeterColor"></div>
            </div>
            <div id="globalMeterPeak" class="meterPeak"></div>
            <div id="globalMeterClip" class="meterClip"></div>
          </div>
        </div>
      </div>

      <div class="row d-flex gap-2 align-items-center flex-wrap mb-3">

        <!-- FILE INPUT / EXPORT -->
        <div class="toolbar-section">
          <span class="section-label">File</span>
          <input id="files" type="file" accept="audio/*" multiple class="visually-hidden" />
          <label for="files" class="col-md-auto newBtn">
            <span class="icon-upload"></span>
          </label>
          <button id="render" class="col-md-auto newBtn">
            <span class="icon-download"></span>
          </button>
        </div>

        <!-- ZOOM -->
        <div class="toolbar-section">
          <span class="section-label">Zoom</span>
          <label class="col-md-auto zoom d-flex align-items-center gap-2">
            <button id="zoomOut" type="button" class="newBtn">
              <span class="icon-minus"></span>
            </button>
            <input id="zoom" type="range" class="form-range range-custom" min="0" max="1000" step="1" value="0" />
            <button id="zoomIn" type="button" class="newBtn">
              <span class="icon-plus"></span>
            </button>
            <span id="zoomVal" class="volDb">800</span>
            <span class="dbSuffix">px/s</span>
          </label>
        </div>

        <!-- PLAY / STOP -->
        <div class="toolbar-section">
          <span class="section-label">Transport</span>
          <button id="play" class="col-md-auto newBtn playStopBtns active">
            <span class="icon-play3"></span>
          </button>
          <button id="stop" class="col-md-auto newBtn playStopBtns">
            <span class="icon-stop2"></span>
          </button>
        </div>

        <!-- TOOLS -->
        <div class="toolbar-section" role="toolbar" aria-label="Toolbar with button groups">
          <span class="section-label">Tools</span>
          <div class="btn-group tools" role="group" aria-label="Tools">
            <button id="toolMove" type="button" title="toggle move tool" class="newBtn toolBtn active" aria-pressed="true">
              <span class="icon-film"></span>
            </button>
            <button id="toolTrim" type="button" title="toggle trim tool" class="newBtn toolBtn active" aria-pressed="true">
              <span class="icon-crop"></span>
            </button>
            <button id="toolKeys" type="button" title="toggle keyframe tool" class="newBtn toolBtn active" aria-pressed="true">
              <span class="icon-pushpin"></span>
            </button>
            <button id="toolSnap" type="button" title="toggle snapping" class="newBtn toolBtn active" aria-pressed="true">
              <span class="icon-magnet"></span>
            </button>
          </div>
        </div>

        <!-- MASTER VOLUME -->
        <div class="toolbar-section">
          <span class="section-label">Master</span>
          <label class="d-flex align-items-center gap-2">
            <input id="masterVol" type="range" class="form-range range-custom" min="-80" max="12" step="0.1" value="0" />
            <div class="volPill">
              <input id="masterDb" class="volDb" type="text" value="0.0" />
              <span class="dbSuffix">dB</span>
            </div>
          </label>
        </div>

        <!-- CLEAR PROJECT -->
        <div class="toolbar-section">
          <span class="section-label">Clear</span>
          <button id="clear" class="col-md-auto newBtn">
            <span class="icon-bin"></span>
          </button>
        </div>

      </div>
    </div>

    <div class="container-fluid">
      <div id="timelineShell">
        <div id="rulerBar">
          <div id="rulerViewport">
            <canvas id="rulerCanvas" height="28"></canvas>
          </div>
        </div>

        <div id="layers">
          <div id="tracks"></div>

          <template id="layerTemplate">
            <div class="layer">
              <div class="layerControls">
                <input
                  class="small offset form-control form-control-sm"
                  type="number"
                  step="0.01"
                  min="0"
                  value="0"
                />

                <div class="controlsTop">
                  <button type="button" class="newBtn layerBtn del" title="Delete layer" aria-label="Delete layer">
                    <span class="icon-bin"></span>
                  </button>
                  <button type="button" class="newBtn layerBtn mute" title="Mute layer" aria-label="Mute layer" aria-pressed="false">
                    <span class="icon-volume-medium"></span>
                  </button>
                </div>

                <div class="volRow">
                  <span class="volLabel">Vol</span>
                  <input class="vol form-range range-custom" type="range" min="-80" max="12" step="0.1" value="0" aria-label="Volume" />
                  <div class="volPill">
                    <input class="volDb" type="text" value="0.0" aria-label="Volume in dB" />
                    <span class="dbSuffix">dB</span>
                  </div>
                </div>

              </div>

              <div class="nameWrapper">
                <div class="name"></div>
              </div>

              <div class="track">
                <div class="clip">
                  <div class="wave">
                    <div class="wave-container">
                      <div class="canvas-wrapper">
                      </div>
                    </div>
                  </div>
                  <svg class="fadeSvg"></svg>
                  <svg class="autoSvg"></svg>
                  <div class="fadeHandle left" title="Fade in"></div>
                  <div class="fadeHandle right" title="Fade out"></div>
                  <div class="trimHandle left" title="Trim start"></div>
                  <div class="trimHandle right" title="Trim end"></div>
                  <div class="fadeInfo left"></div>
                  <div class="fadeInfo right"></div>
                  <div class="trimInfo left"></div>
                  <div class="trimInfo right"></div>
                </div>
              </div>

              <div class="effectsRack">
                <div class="btn-group">
                  <button
                    class="newBtn fxAdd dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    title="Add effect"
                  >
                    +
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end fxMenu"></ul>
                </div>

                <div class="fxList"></div>
              </div>

            </div>
          </template>

          <template id="fxMenuItemTemplate">
            <button type="button" class="dropdown-item fxMenuItem"></button>
          </template>

          <template id="fxBlockTemplate">
            <div class="fxBlock" role="button" tabindex="0">
              <div class="fxHeader">
                <div class="fxMain">
                  <label class="fxSwitch" title="Enable effect">
                    <input class="fxEnabled" type="checkbox" />
                    <span class="fxSlider"></span>
                  </label>
                  <div class="fxTitle">Effect</div>
                </div>
                <div class="fxValueSlot"></div>
              </div>
              <div class="fxBody"></div>
              <button type="button" class="fxRemove del" title="Remove effect" aria-label="Remove effect">
                <span class="icon-bin"></span>
              </button>
            </div>
          </template>

        </div>

        <div id="globalPlayhead" class="globalPlayhead"></div>
      </div>
    </div>

    <div id="loading" class="loading hidden" role="status" aria-live="polite">
      <div class="loadingPanel">
        <div class="spinner"></div>
        <div id="loadingText">Loading</div>
      </div>
    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
